<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!-- 공유 미리보기(OG) 이미지 원본. 수정 후 `node scripts/og/generate.cjs` 로 public/og.png 재생성 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Pretendard, sans-serif; color: #fafafa;
    background: #09090b;
    background-image:
      radial-gradient(ellipse 70% 80% at 85% 10%, rgba(37,99,235,.35), transparent 60%),
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
    padding: 72px 80px; display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; gap: 16px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #fafafa; color: #09090b;
          display: grid; place-items: center; font: 800 30px ui-monospace, monospace; }
  .pill { margin-left: auto; border: 1px solid #3f3f46; border-radius: 999px; padding: 8px 18px;
          font: 500 20px ui-monospace, monospace; color: #a1a1aa; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
  .brand { font-weight: 700; font-size: 28px; }
  h1 { margin-top: 64px; font-size: 92px; font-weight: 800; line-height: 1.08; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #60a5fa; }
  p { margin-top: 24px; font-size: 30px; color: #a1a1aa; }
  .hubs { margin-top: auto; display: flex; gap: 14px; }
  .hub { border: 1px solid #27272a; background: rgba(24,24,27,.8); border-radius: 12px;
         padding: 12px 22px; font-size: 24px; font-weight: 600; color: #e4e4e7; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">7</div>
    <span class="brand">기본학교 7기</span>
    <span class="pill"><span class="dot"></span>cohort.7 — online</span>
  </div>
  <h1>함께 배우고,<br /><em>함께 만드는</em> 기본학교 7기</h1>
  <p>동지들의 AI 스킬 · 학습 자료 · 홈페이지가 모이는 곳</p>
  <div class="hubs">
    <span class="hub">⚡ AI 스킬</span>
    <span class="hub">🌐 동지 홈페이지</span>
    <span class="hub">🗂️ 자료 드라이브</span>
    <span class="hub">🤝 동지 네트워크</span>
  </div>
</body>
</html>
